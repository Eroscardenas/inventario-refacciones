@if (abierto) {
  <button
    type="button"
    aria-label="Cerrar formulario"
    (click)="cancelar()"
    [disabled]="guardando"
    class="fixed inset-0 z-40 cursor-default bg-slate-950/75 backdrop-blur-sm disabled:cursor-wait"
  ></button>

  <aside
    class="fixed right-0 top-0 z-50 h-full w-full max-w-md overflow-y-auto border-l border-slate-800 bg-slate-900 p-6 text-slate-100 shadow-2xl"
  >
    <header class="mb-7 flex items-start justify-between gap-4">
      <div>
        <p
          class="text-xs font-semibold uppercase tracking-[0.25em] text-cyan-400"
        >
          {{ esEdicion ? 'Actualización' : 'Registro' }}
        </p>

        <h2 class="mt-2 text-2xl font-bold">
          {{ esEdicion ? 'Editar refacción' : 'Nueva refacción' }}
        </h2>

        <p class="mt-1 text-sm text-slate-400">
          Completa los datos de la refacción.
        </p>
      </div>

      <button
        type="button"
        (click)="cancelar()"
        [disabled]="guardando"
        class="rounded-lg border border-slate-700 px-3 py-2 text-sm text-slate-300 transition hover:border-slate-500 hover:text-white disabled:cursor-wait disabled:opacity-60"
      >
        Cerrar
      </button>
    </header>

    <form
      class="space-y-5 transition"
      [class.pointer-events-none]="guardando"
      [class.opacity-80]="guardando"
      (ngSubmit)="enviarFormulario()"
    >
      <div>
        <label
          for="nombre"
          class="mb-2 block text-sm font-medium text-slate-300"
        >
          Nombre
        </label>

        <input
          id="nombre"
          name="nombre"
          type="text"
          required
          maxlength="120"
          autocomplete="off"
          [disabled]="guardando"
          [(ngModel)]="formulario.nombre"
          class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 outline-none transition placeholder:text-slate-600 focus:border-cyan-400 disabled:cursor-wait disabled:opacity-60"
          placeholder="Ej. Filtro de aceite"
        />
      </div>

      <div>
        <label
          for="sku"
          class="mb-2 block text-sm font-medium text-slate-300"
        >
          SKU
        </label>

        <input
          id="sku"
          name="sku"
          type="text"
          required
          maxlength="50"
          autocomplete="off"
          [disabled]="guardando"
          [(ngModel)]="formulario.sku"
          class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 uppercase outline-none transition placeholder:text-slate-600 focus:border-cyan-400 disabled:cursor-wait disabled:opacity-60"
          placeholder="Ej. FIL-001"
        />
      </div>

      <div>
        <label
          for="categoria"
          class="mb-2 block text-sm font-medium text-slate-300"
        >
          Categoría
        </label>

        <input
          id="categoria"
          name="categoria"
          type="text"
          required
          maxlength="80"
          autocomplete="off"
          [disabled]="guardando"
          [(ngModel)]="formulario.categoria"
          class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 outline-none transition placeholder:text-slate-600 focus:border-cyan-400 disabled:cursor-wait disabled:opacity-60"
          placeholder="Ej. Motor"
        />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label
            for="precio"
            class="mb-2 block text-sm font-medium text-slate-300"
          >
            Precio
          </label>

          <input
            id="precio"
            name="precio"
            type="number"
            min="0"
            step="0.01"
            required
            [disabled]="guardando"
            [(ngModel)]="formulario.precio"
            class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 outline-none transition focus:border-cyan-400 disabled:cursor-wait disabled:opacity-60"
          />
        </div>

        <div>
          <label
            for="stock"
            class="mb-2 block text-sm font-medium text-slate-300"
          >
            Stock
          </label>

          <input
            id="stock"
            name="stock"
            type="number"
            min="0"
            step="1"
            required
            [disabled]="guardando"
            [(ngModel)]="formulario.stock"
            class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 outline-none transition focus:border-cyan-400 disabled:cursor-wait disabled:opacity-60"
          />
        </div>
      </div>

      <div class="flex gap-3 border-t border-slate-800 pt-6">
        <button
          type="submit"
          [disabled]="guardando"
          class="flex flex-1 items-center justify-center gap-2 rounded-xl bg-cyan-400 px-5 py-3 font-semibold text-slate-950 transition hover:bg-cyan-300 disabled:cursor-wait disabled:opacity-70"
        >
          @if (guardando) {
            <span
              class="h-5 w-5 animate-spin rounded-full border-2 border-slate-900 border-t-transparent"
            ></span>

            <span>
              {{ esEdicion ? 'Actualizando...' : 'Guardando...' }}
            </span>
          } @else {
            <span>
              {{ esEdicion ? 'Actualizar refacción' : 'Guardar refacción' }}
            </span>
          }
        </button>

        <button
          type="button"
          (click)="cancelar()"
          [disabled]="guardando"
          class="rounded-xl border border-slate-700 px-5 py-3 font-semibold text-slate-300 transition hover:border-slate-500 hover:text-white disabled:cursor-wait disabled:opacity-60"
        >
          Cancelar
        </button>
      </div>
    </form>
  </aside>
}
