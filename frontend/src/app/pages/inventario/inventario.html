<main class="min-h-screen bg-gray-950 px-4 py-8 text-gray-100 md:px-8">
  <section class="mx-auto max-w-7xl">
    <header
      class="mb-6 flex flex-col gap-5 md:flex-row md:items-end md:justify-between"
    >
      <div>
        <p
          class="text-sm font-semibold uppercase tracking-[0.3em] text-purple-500"
        >
          Taller
        </p>

        <h1 class="mt-2 text-3xl font-bold md:text-4xl">
          Inventario de refacciones
        </h1>
      </div>

      <div class="flex flex-wrap gap-3">
        <article
          class="min-w-32 rounded-xl border border-gray-800 bg-gray-800 px-4 py-3"
        >
          <p class="text-2xl font-bold text-purple-500">
            {{ totalPiezas }}
          </p>

          <p class="text-sm text-gray-400">
            Piezas totales
          </p>
        </article>
      </div>
    </header>

    <section
      class="overflow-hidden rounded-2xl border border-gray-800 bg-gray-900 shadow-2xl shadow-cyan-950/20"
    >
      <div
        class="grid gap-3 border-b border-gray-800 p-5 md:grid-cols-[1fr_240px_auto_auto_auto]"
      >
        <input
          type="search"
          placeholder="Buscar por nombre"
          [(ngModel)]="buscar"
          (keyup.enter)="cargarRefacciones()"
          class="rounded-xl border border-gray-700 bg-gray-950 px-4 py-3 text-gray-100 outline-none transition placeholder:text-gray-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/10"
        />

        <input
          type="text"
          placeholder="Categoría"
          [(ngModel)]="categoria"
          (keyup.enter)="cargarRefacciones()"
          class="rounded-xl border border-gray-700 bg-gray-950 px-4 py-3 text-gray-100 outline-none transition placeholder:text-gray-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/10"
        />

        <button
          type="button"
          (click)="cargarRefacciones()"
          class="rounded-xl border border-gray-700 px-5 py-3 font-semibold transition hover:border-cyan-400 hover:bg-cyan-400/5 hover:text-cyan-300"
        >
          Buscar
        </button>

        <button
          type="button"
          (click)="limpiarFiltros()"
          class="rounded-xl border border-gray-700 px-5 py-3 font-semibold text-gray-300 transition hover:border-gray-500 hover:bg-gray-800 hover:text-white"
        >
          Limpiar
        </button>

        <button
          type="button"
          (click)="abrirFormulario()"
          class="rounded-xl bg-purple-800 px-5 py-3 font-semibold text-gray-950 transition duration-200 hover:-trangray-y-0.5 hover:bg-purple-300 hover:shadow-lg hover:shadow-purple-400/10 active:trangray-y-0"
        >
          Nueva refacción
        </button>
      </div>

      <app-refaccion-table
        [refacciones]="refacciones"
        [cargando]="cargando"
        (editar)="editarRefaccion($event)"
        (eliminar)="eliminarRefaccion($event)"
      />
    </section>
  </section>

  <app-refaccion-form
    [abierto]="mostrarFormulario"
    [guardando]="guardando"
    [refaccion]="refaccionSeleccionada"
    (guardar)="guardarRefaccion($event)"
    (cerrar)="cerrarFormulario()"
  />

  @if (mostrarConfirmacion && refaccionAEliminar) {
    <div
      class="fixed inset-0 z-50 flex items-center justify-center bg-gray-950/80 px-4 backdrop-blur-sm"
    >
      <section
        class="w-full max-w-md rounded-2xl border border-gray-800 bg-gray-900 p-6 shadow-2xl shadow-black/40"
      >
        <div
          class="mb-5 flex h-12 w-12 items-center justify-center rounded-full bg-red-500/10 text-2xl text-red-300"
        >
          !
        </div>

        <h2 class="text-2xl font-bold text-gray-100">
          Eliminar refaccion
        </h2>

        <p class="mt-3 text-sm leading-6 text-gray-400">
          ¿Deseas eliminar la refaccion
          <span class="font-semibold text-gray-200">
            {{ refaccionAEliminar.nombre }}
          </span>
          ?
        </p>

        <p class="mt-2 text-sm text-red-500">
          Esta accion no se puede deshacer.
        </p>

        <div class="mt-7 flex justify-end gap-3">
          <button
            type="button"
            (click)="cancelarEliminacion()"
            [disabled]="eliminando"
            class="rounded-xl border border-gray-700 px-5 py-3 font-semibold text-gray-300 transition hover:border-gray-500 hover:bg-gray-800 hover:text-white disabled:cursor-wait disabled:opacity-60"
          >
            Cancelar
          </button>

          <button
            type="button"
            (click)="confirmarEliminacion()"
            [disabled]="eliminando"
            class="flex min-w-36 items-center justify-center gap-2 rounded-xl bg-red-900 px-5 py-3 font-semibold text-white transition hover:bg-red-700 disabled:cursor-wait disabled:opacity-70"
          >
            @if (eliminando) {
              <span
                class="h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"
              ></span>

              Eliminando...
            } @else {
              Sí, eliminar
            }
          </button>
        </div>
      </section>
    </div>
  }
</main>
