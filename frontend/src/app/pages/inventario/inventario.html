<main class="min-h-screen bg-slate-950 px-4 py-8 text-slate-100 md:px-8">
  <section class="mx-auto max-w-7xl">
    <header
      class="mb-6 flex flex-col gap-5 md:flex-row md:items-end md:justify-between"
    >
      <div>
        <p
          class="text-sm font-semibold uppercase tracking-[0.3em] text-cyan-400"
        >
          Taller
        </p>

        <h1 class="mt-2 text-3xl font-bold md:text-4xl">
          Inventario de refacciones
        </h1>

        <p class="mt-2 text-slate-400">
          Busca, registra y administra el inventario.
        </p>
      </div>

      <div class="flex flex-wrap gap-3">
        <article
          class="min-w-28 rounded-xl border border-slate-800 bg-slate-900 px-4 py-3"
        >
          <p class="text-2xl font-bold text-cyan-300">
            {{ totalPiezas }}
          </p>

          <p class="text-sm text-slate-400">
            Piezas
          </p>
        </article>

        <article
          class="min-w-28 rounded-xl border border-red-500/20 bg-red-500/10 px-4 py-3"
        >
          <p class="text-2xl font-bold text-red-300">
            {{ stockBajo }}
          </p>

          <p class="text-sm text-red-200/70">
            Stock bajo
          </p>
        </article>
      </div>
    </header>

    @if (mensaje) {
      <div
        class="mb-5 rounded-xl border border-emerald-500/30 bg-emerald-500/10 px-4 py-3 text-emerald-300"
      >
        {{ mensaje }}
      </div>
    }

    @if (error) {
      <div
        class="mb-5 rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-red-300"
      >
        {{ error }}
      </div>
    }

    <section
      class="overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 shadow-2xl shadow-cyan-950/20"
    >
      <div
        class="grid gap-3 border-b border-slate-800 p-5 md:grid-cols-[1fr_240px_auto_auto_auto]"
      >
        <input
          type="search"
          placeholder="Buscar por nombre"
          [(ngModel)]="buscar"
          (keyup.enter)="cargarRefacciones()"
          class="rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-cyan-400"
        />

        <input
          type="text"
          placeholder="Categoría"
          [(ngModel)]="categoria"
          (keyup.enter)="cargarRefacciones()"
          class="rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none transition placeholder:text-slate-500 focus:border-cyan-400"
        />

        <button
          type="button"
          (click)="cargarRefacciones()"
          class="rounded-xl border border-slate-700 px-5 py-3 font-semibold transition hover:border-cyan-400 hover:text-cyan-300"
        >
          Buscar
        </button>

        <button
          type="button"
          (click)="limpiarFiltros()"
          class="rounded-xl border border-slate-700 px-5 py-3 font-semibold text-slate-300 transition hover:border-slate-500 hover:text-white"
        >
          Limpiar
        </button>

        <button
          type="button"
          (click)="abrirFormulario()"
          class="rounded-xl bg-cyan-400 px-5 py-3 font-semibold text-slate-950 transition hover:-translate-y-0.5 hover:bg-cyan-300"
        >
          Nueva refacción
        </button>
      </div>

      <app-refaccion-table
        [refacciones]="refacciones"
        [cargando]="cargando"
        (editar)="editarRefaccion($event)"
        (eliminar)="eliminarRefaccion($event)"
      />
    </section>
  </section>

  <app-refaccion-form
    [abierto]="mostrarFormulario"
    [guardando]="guardando"
    [refaccion]="refaccionSeleccionada"
    (guardar)="guardarRefaccion($event)"
    (cerrar)="cerrarFormulario()"
  />
</main>
